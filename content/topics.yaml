# Постоянные идентификаторы тем каталога (docs/catalog.md).
#
# Идентификатор не меняется при переименовании и никогда не используется
# повторно: на нём держится история повторений. Последняя часть id — часть
# адреса страницы темы: algo.sorting.insertion → /ru/algorithms/sorting/insertion/.
# Новая тема каталога получает новую строку на своём месте.
#
# title — название из каталога; проверка сверяет его с docs/catalog.md.
# wave — волна темы, если модуль выходит в нескольких волнах (ТЗ, «Темы-предпосылки волны 1»).

