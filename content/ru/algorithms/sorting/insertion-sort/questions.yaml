    normalize: complexity
    prompt: Сколько операций делает сортировка вставками в худшем случае — на массиве, упорядоченном по убыванию? Ответьте оценкой Θ.
    answers: ['Θ(n^2)']

  - id: algo.sorting.insertion.q.base-output
    version: 1
    level: base
    role: practice
    step: 2
    skill: algo.sorting.insertion.s.trace-code
    type: output
    format: free
    prompt: Что выведет этот код?
    code: |
      const a = [3, 1, 2];
      let swaps = 0;
      for (let i = 1; i < a.length; i++) {
        for (let j = i; j > 0 && a[j - 1] > a[j]; j--) {
          [a[j - 1], a[j]] = [a[j], a[j - 1]];
          swaps++;
        }
      }
      console.log(swaps, a);

