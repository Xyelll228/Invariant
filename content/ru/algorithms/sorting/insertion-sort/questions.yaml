topic: algo.sorting.insertion

skills:
  # Фундамент
  - id: algo.sorting.insertion.s.idea
    title: Идея сортировки вставками — что берётся на шаге и куда вставляется
    level: fundament
  - id: algo.sorting.insertion.s.after-k-steps
    title: Состояние массива после k шагов сортировки вставками
    level: fundament
  - id: algo.sorting.insertion.s.insert-one
    title: Вставка одного элемента в упорядоченную левую часть
    level: fundament
  - id: algo.sorting.insertion.s.simulate
    title: Выполнить сортировку вставками вручную
    level: fundament
  - id: algo.sorting.insertion.s.assemble
    title: Собрать сортировку вставками из строк кода
    level: fundament
  # База
  - id: algo.sorting.insertion.s.properties
    title: Свойства сортировки вставками — устойчивость и работа на месте
    level: base
  - id: algo.sorting.insertion.s.complexity
    title: Сложность сортировки вставками в разных случаях и рост при удвоении n
    level: base
  - id: algo.sorting.insertion.s.trace-code
    title: Проследить работу кода сортировки вставками
    level: base
  - id: algo.sorting.insertion.s.proof-idea
    title: Инвариант сортировки вставками — идея доказательства
    level: base
  - id: algo.sorting.insertion.s.write
    title: Написать сортировку вставками самостоятельно
    level: base
