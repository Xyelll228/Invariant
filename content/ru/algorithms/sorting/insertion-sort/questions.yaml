misconceptions:
  # Фундамент
  - id: algo.sorting.insertion.m.one-step-short
    text: Делает на один шаг меньше, чем спрошено.
    explanation: >-
      Первым шагом вставляется элемент с индексом 1: элемент с индексом 0 стоит
      в левой части с самого начала. Поэтому после k шагов упорядочены первые
      k + 1 элементов, а не k.
    block: algo.sorting.insertion.b.misconceptions
  - id: algo.sorting.insertion.m.one-step-extra
    text: Делает на один шаг больше, чем спрошено.
    explanation: >-
      После k шагов вставлены элементы с индексами от 1 до k. Элемент с индексом
      k + 1 и всё, что правее, ещё не тронуто.
    block: algo.sorting.insertion.b.misconceptions
  - id: algo.sorting.insertion.m.selection
    text: Путает сортировку вставками с сортировкой выбором.
    explanation: >-
      Сортировка выбором на каждом шаге ищет минимум в правой части и меняет его
      местами с первым элементом этой части. Сортировка вставками минимум не ищет:
      она берёт первый элемент правой части и вставляет его в левую, а остальная
      правая часть не меняется.
    block: algo.sorting.insertion.b.confusion
  - id: algo.sorting.insertion.m.common-property
    text: Принимает общее свойство двух сортировок за их отличие.
    explanation: >-
      И у вставок, и у выбора левая часть растёт на один элемент за шаг.
      Отличаются они тем, какой элемент добавляется: вставки берут первый элемент
      правой части, а выбор — наименьший.
    block: algo.sorting.insertion.b.confusion
  - id: algo.sorting.insertion.m.sort-at-end
    text: Откладывает упорядочивание на конец.
    explanation: >-
      В сортировке вставками левая часть упорядочена после каждого шага, а не
      только в конце. Каждый новый элемент сразу встаёт на своё место.
    block: algo.sorting.insertion.b.idea
  - id: algo.sorting.insertion.m.to-front
    text: Сдвигает вставляемый элемент до самого начала массива.
    explanation: >-
      Элемент сдвигается влево, только пока сосед слева больше него. Как только
      слева оказывается элемент не больше него, сдвиг останавливается.
    block: algo.sorting.insertion.b.idea
  - id: algo.sorting.insertion.m.single-swap
    text: Делает один обмен вместо сдвига до своего места.
    explanation: >-
      Один обмен сдвигает элемент на одну позицию. Если и следующий сосед слева
      больше, нужен ещё обмен — и так, пока элемент не встанет на своё место.
    block: algo.sorting.insertion.b.idea
  # База
  - id: algo.sorting.insertion.m.off-by-one-start
    text: Считает, что внешний цикл можно начать с любого индекса.
    explanation: >-
      Элемент с индексом 1 тоже нужно вставить: если начать с i = 2, он может
      остаться не на своём месте. Начало с i = 1 — не формальность.
    block: algo.sorting.insertion.b.definition
  - id: algo.sorting.insertion.m.loop-bound
    text: Путает условие внутреннего цикла.
    explanation: >-
      Элемент может дойти до самого начала массива, до индекса 0. Поэтому сдвиг
      продолжается, пока j > 0, а не j > 1.
    block: algo.sorting.insertion.b.definition
  - id: algo.sorting.insertion.m.wrong-bound
    text: Путает, какая граница цикла испорчена.
    explanation: >-
      Сверьте каждую границу с эталоном. Внешний цикл идёт от i = 1, пока i < n;
      внутренний — пока j > 0 и сосед слева больше.
    block: algo.sorting.insertion.b.base-misconceptions
  - id: algo.sorting.insertion.m.stability-lost
    text: Считает, что сортировка вставками может переставить равные элементы.
    explanation: >-
      Обмен делается, только если сосед слева строго больше. Равный сосед
      останавливает вставку, поэтому порядок равных элементов сохраняется.
    block: algo.sorting.insertion.b.definition
  - id: algo.sorting.insertion.m.ge-infinite
    text: Считает, что с >= внутренний цикл станет бесконечным.
    explanation: >-
      Каждый обмен уменьшает j, а цикл останавливается не позже j = 0. С >=
      обменов может стать больше, но цикл всё равно закончится.
    block: algo.sorting.insertion.b.base-misconceptions
  - id: algo.sorting.insertion.m.ge-unsorted
    text: Считает, что с >= массив перестанет упорядочиваться.
    explanation: >-
      С >= местами меняются и равные элементы, но больший элемент по-прежнему не
      остаётся левее меньшего. Массив упорядочится, изменится только порядок равных.
    block: algo.sorting.insertion.b.base-misconceptions
  - id: algo.sorting.insertion.m.case-confusion
    text: Путает лучший и худший случай сортировки вставками.
    explanation: >-
      Упорядоченный массив — лучший случай: каждую вставку заканчивает первое же
      сравнение. Больше всего работы на массиве различных чисел, упорядоченном по
      убыванию: каждый элемент доходит до начала.
    block: algo.sorting.insertion.b.complexity
  - id: algo.sorting.insertion.m.precheck
    text: Думает, что сортировка заранее проверяет, упорядочен ли массив.
    explanation: >-
      Отдельной проверки нет. На упорядоченном массиве каждая вставка
      заканчивается после первого же сравнения — так и получается n − 1 сравнений.
    block: algo.sorting.insertion.b.complexity
  - id: algo.sorting.insertion.m.compare-all
    text: Думает, что каждый элемент сравнивается со всеми элементами слева.
    explanation: >-
      Вставка останавливается на первом соседе, который не больше вставляемого
      элемента. Левее него элементы ещё меньше или равны, и сравнивать их не нужно.
    block: algo.sorting.insertion.b.complexity
  - id: algo.sorting.insertion.m.always-quadratic
    text: Считает, что сортировка вставками всегда делает около n²/2 сравнений.
    explanation: >-
      Так бывает только в худшем случае. Число операций зависит от порядка
      элементов: на упорядоченном массиве сравнений n − 1.
    block: algo.sorting.insertion.b.complexity
  - id: algo.sorting.insertion.m.right-sorted
    text: Считает, что правая часть массива тоже упорядочена.
    explanation: >-
      Правую часть сортировка ещё не трогала: там элементы в исходном порядке.
      Упорядочена только левая часть a[0..i − 1].
    block: algo.sorting.insertion.b.proof-idea
  - id: algo.sorting.insertion.m.growth-linear
    text: Считает, что при удвоении n квадратичное число операций растёт вдвое.
    explanation: >-
      Если операций около c · n², то при длине 2n их около c · (2n)² = 4 · c · n².
      Вдвое при удвоении n растёт линейная функция.
    block: algo.sorting.insertion.b.measurement
    prerequisite: algo.analysis.asymptotics
  - id: algo.sorting.insertion.m.growth-cubic
    text: Путает показатель степени и считает, что n² при удвоении n растёт в 8 раз.
    explanation: >-
      (2n)² = 4n², поэтому квадратичная функция растёт в 4 раза. В 8 раз растёт
      n³: (2n)³ = 8n³.
    block: algo.sorting.insertion.b.measurement
    prerequisite: algo.analysis.asymptotics
  - id: algo.sorting.insertion.m.infinite-loop
    text: Считает, что без j-- цикл обменов станет бесконечным.
    explanation: >-
      После обмена a[j − 1] < a[j], и условие a[j − 1] > a[j] ложно. Цикл
      заканчивается после одного обмена, поэтому элемент сдвигается не больше
      чем на одну позицию.
    block: algo.sorting.insertion.b.base-misconceptions
  - id: algo.sorting.insertion.m.no-effect
    text: Считает, что строка j-- ни на что не влияет.
    explanation: >-
      Без j-- вставка всё время сравнивает одну и ту же пару ячеек. Элемент
      сдвигается не больше чем на одну позицию, и массив может остаться
      неупорядоченным.
    block: algo.sorting.insertion.b.base-misconceptions
  - id: algo.sorting.insertion.m.bug-everywhere
    text: Думает, что код с ошибкой ошибается на любых данных.
    explanation: >-
      Ошибка видна, только если данные доходят до испорченного места. На многих
      массивах неверный код даёт верный ответ, поэтому тест нужно подбирать.
    block: algo.sorting.insertion.b.base-misconceptions
  # Глубина
  - id: algo.sorting.insertion.m.swap-other-pairs
    text: Думает, что обмен соседей меняет и другие пары элементов.
    explanation: >-
      Обмен меняет порядок только внутри пары соседей. Любой другой элемент стоит
      левее обоих или правее обоих — и до обмена, и после, поэтому его пары с
      ними не меняются. Число инверсий уменьшается ровно на один.
    block: algo.sorting.insertion.b.inversions
  - id: algo.sorting.insertion.m.compares-equal-swaps
    text: Считает, что сравнений столько же, сколько обменов.
    explanation: >-
      Вставка, которая не дошла до начала массива, заканчивается неудачным
      сравнением без обмена. Поэтому сравнений от I до I + n − 1, где I — число
      инверсий.
    block: algo.sorting.insertion.b.exact-count
  - id: algo.sorting.insertion.m.sorted-during-insertion
    text: Считает, что во время вставки часть a[0..i] уже упорядочена.
    explanation: >-
      Пока вставка не закончилась, левее x может стоять больший элемент. Часть
      a[0..i] упорядочена только после выхода из внутреннего цикла.
    block: algo.sorting.insertion.b.invariant
  - id: algo.sorting.insertion.m.exit-condition
    text: Принимает условие выхода из цикла за инвариант.
    explanation: >-
      То, что левее x стоят элементы не больше него, известно только при выходе из
      цикла. Пока цикл идёт, сосед слева может быть больше — поэтому и нужен
      следующий обмен.
    block: algo.sorting.insertion.b.invariant
  - id: algo.sorting.insertion.m.final-position
    text: Думает, что после вставки элемент стоит на своём окончательном месте.
    explanation: >-
      После вставки элемент на своём месте только среди a[0..i]. Элементы правее
      ещё не вставлены, и меньшие из них потом сдвинут его вправо.
    block: algo.sorting.insertion.b.invariant
  - id: algo.sorting.insertion.m.binary-fast
    text: Считает, что бинарный поиск места делает сортировку вставками O(n log n).
    explanation: >-
      Бинарный поиск сокращает сравнения, но элементы по-прежнему сдвигаются по
      одному. Сдвигов столько же, сколько инверсий: в среднем и худшем случае Θ(n²).
    block: algo.sorting.insertion.b.variants
  - id: algo.sorting.insertion.m.binary-adaptive
    text: Считает, что бинарные вставки на упорядоченном массиве делают n − 1 сравнений.
    explanation: >-
      Бинарный поиск не знает, что элемент уже на месте, и делит отрезок до конца.
      На упорядоченном массиве это около log₂ i сравнений на элемент, всего
      Θ(n log n).
    block: algo.sorting.insertion.b.variants
  - id: algo.sorting.insertion.m.binary-compares-quadratic
    text: Путает сравнения и сдвиги бинарных вставок.
    explanation: >-
      Квадратичны у бинарных вставок сдвиги, а не сравнения. При вставке элемента
      с индексом i сравнений не больше ⌈log₂(i + 1)⌉, всего O(n log n).
    block: algo.sorting.insertion.b.variants
  - id: algo.sorting.insertion.m.binary-loop
    text: Считает, что с >= бинарный поиск зациклится.
    explanation: >-
      На каждом шаге отрезок от lo до hi сокращается: hi = mid или lo = mid + 1.
      Поиск всегда заканчивается, меняется только найденное место.
    block: algo.sorting.insertion.b.variants
  - id: algo.sorting.insertion.m.shift-fewer-compares
    text: Считает, что сдвиги вместо обменов уменьшают число сравнений.
    explanation: >-
      Вставка сдвигами сравнивает те же пары, что и вставка обменами. Меньше
      становится записей в массив, а не сравнений.
    block: algo.sorting.insertion.b.variants
  - id: algo.sorting.insertion.m.same-compares
    text: Считает, что все версии сортировки вставками делают одинаково сравнений.
    explanation: >-
      Бинарный поиск находит место не больше чем за ⌈log₂(i + 1)⌉ сравнений вместо
      i. Поэтому на случайных данных бинарные вставки делают намного меньше
      сравнений.
    block: algo.sorting.insertion.b.variants

questions:
  # ---------- Фундамент ----------
  - id: algo.sorting.insertion.q.pre-cards
    version: 1
    level: fundament
    role: pre
    type: choice
    format: choice
    prompt: Вы раскладываете карты в руке по возрастанию и берёте их по одной. Что разумно делать с очередной картой?
    options:
      - text: Вставить её среди уже разложенных так, чтобы порядок сохранился
        correct: true
      - text: Найти среди оставшихся самую младшую и положить её следующей
        misconception: algo.sorting.insertion.m.selection
      - text: Положить в конец, а когда все карты в руке — разложить их заново
        misconception: algo.sorting.insertion.m.sort-at-end
    explanation: >-
      Так работает сортировка вставками: разложенные карты всегда упорядочены, а
      каждая новая сразу встаёт на своё место.

  - id: algo.sorting.insertion.q.pre-start
    version: 1
    level: fundament
    role: pre
    type: free
    format: free
    normalize: number
    prompt: Сортировка вставками упорядочивает массив `[4, 2, 7]`. Сколько элементов в упорядоченной левой части до первого шага?
    answers: ['1']
    explanation: >-
      Один — элемент с индексом 0. Один элемент сам по себе упорядочен, поэтому
      первым шагом вставляется элемент с индексом 1.

  - id: algo.sorting.insertion.q.idea-next
    version: 1
    level: fundament
    role: practice
    step: 1
    block: algo.sorting.insertion.b.idea
    skill: algo.sorting.insertion.s.idea
    type: choice
    format: choice
    prompt: Какой элемент сортировка вставками берёт на очередном шаге?
    options:
      - text: Первый элемент правой части — той, до которой очередь ещё не дошла
        correct: true
      - text: Наименьший элемент правой части
        misconception: algo.sorting.insertion.m.selection
    explanation: >-
      Правая часть не меняется, пока до её элементов не дойдёт очередь. На каждом
      шаге берётся её первый элемент.

  - id: algo.sorting.insertion.q.idea-stop
    version: 1
    level: fundament
    role: practice
    step: 1
    block: algo.sorting.insertion.b.idea
    skill: algo.sorting.insertion.s.idea
    type: choice
    format: choice
    prompt: Элемент вставляется в упорядоченную левую часть. Когда он перестаёт сдвигаться влево?
    options:
      - text: Когда сосед слева не больше него или элемент дошёл до начала массива
        correct: true
      - text: Только когда элемент дошёл до начала массива
        misconception: algo.sorting.insertion.m.to-front
      - text: Сразу после одного обмена с соседом
        misconception: algo.sorting.insertion.m.single-swap

  - id: algo.sorting.insertion.q.confusion-next
    version: 1
    level: fundament
    role: practice
    step: 1
    block: algo.sorting.insertion.b.confusion
    skill: algo.sorting.insertion.s.idea
    type: confusion
    format: choice
    prompt: Какое утверждение верно для сортировки вставками, но неверно для сортировки выбором?
    options:
      - text: На очередном шаге берётся первый элемент правой части, какой бы он ни был
        correct: true
      - text: На очередном шаге в правой части ищется наименьший элемент
        misconception: algo.sorting.insertion.m.selection
      - text: Левая часть растёт на один элемент за шаг
        misconception: algo.sorting.insertion.m.common-property
    explanation: >-
      Наименьший элемент ищет сортировка выбором. Рост левой части на один элемент
      за шаг — общее свойство обеих сортировок.

  - id: algo.sorting.insertion.q.after-k-steps
    version: 1
    level: fundament
    role: practice
    step: 2
    block: algo.sorting.insertion.b.worked-example
    skill: algo.sorting.insertion.s.after-k-steps
    type: trace
    format: generated
    generator: afterKSteps

  - id: algo.sorting.insertion.q.insert-one
    version: 1
    level: fundament
    role: practice
    step: 2
    block: algo.sorting.insertion.b.worked-example
    skill: algo.sorting.insertion.s.insert-one
    type: trace
    format: generated
    generator: insertOne
    hints:
      - Сравнивайте вставляемый элемент с соседом слева.
