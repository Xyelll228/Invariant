  - id: algo.sorting.insertion.q.depth-explain
    version: 1
    level: depth
    role: practice
    step: 3
    skill: algo.sorting.insertion.s.proof
    type: explain
    format: self
    prompt: Объясните своими словами, почему сортировка вставками делает ровно столько обменов, сколько инверсий в исходном массиве.
    reference: >-
      Сортировка меняет местами только соседей, которые стоят в неправильном
      порядке. Такой обмен исправляет порядок этой пары и не меняет остальные пары:
      любой другой элемент остаётся левее обоих или правее обоих. Значит, каждый
      обмен уменьшает число инверсий ровно на один. В конце массив упорядочен, и
      инверсий нет. Поэтому обменов столько же, сколько было инверсий.
    criteria:
      - Сказано, что местами меняются только соседи в неправильном порядке.
      - Объяснено, почему обмен не меняет остальные пары.
      - Сказано, что в конце инверсий нет, и сделан вывод о числе обменов.

