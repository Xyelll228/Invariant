      - text: Первые три элемента
        misconception: algo.sorting.insertion.m.one-step-short
      - text: Первые четыре элемента, и это четыре наименьших элемента массива
        misconception: algo.sorting.insertion.m.selection

  - id: algo.sorting.insertion.q.check-assemble-desc
    version: 1
    level: fundament
    role: check
    skill: algo.sorting.insertion.s.assemble
    type: parsons
    format: order
    prompt: >-
      Соберите функцию `insertionSortDesc(a)`: сортировку вставками по убыванию.
      Две строки лишние.
    indent: true
    items:
      - { text: 'function insertionSortDesc(a) {', indent: 0 }
      - { text: 'for (let i = 1; i < a.length; i++) {', indent: 1 }
      - { text: 'let j = i;', indent: 2 }
      - { text: 'while (j > 0 && a[j - 1] < a[j]) {', indent: 2 }
      - { text: '[a[j - 1], a[j]] = [a[j], a[j - 1]];', indent: 3 }
      - { text: 'j--;', indent: 3 }
      - { text: '}', indent: 2 }
      - { text: '}', indent: 1 }
      - { text: 'return a;', indent: 1 }
      - { text: '}', indent: 0 }
    distractors:
      - 'while (j > 0 && a[j - 1] > a[j]) {'
      - 'let j = 0;'
    function: insertionSortDesc
    solution: 'function insertionSortDesc(a) { return [...a].sort((x, y) => y - x); }'
    tests: [[[3, 1, 2]], [[5, 5, 1, 9]]]
    hidden: vectors

  - id: algo.sorting.insertion.q.check-explain
    version: 1
    level: fundament
    role: check
    skill: algo.sorting.insertion.s.idea
    type: explain
    format: self
    prompt: Объясните своими словами, почему после k шагов сортировки вставками упорядочены первые k + 1 элементов массива.
    reference: >-
      До первого шага упорядоченная часть состоит из одного элемента — с индексом 0.
      Каждый шаг берёт следующий элемент и вставляет его на своё место в эту часть:
      она растёт на один элемент и остаётся упорядоченной. После k шагов в ней
      1 + k элементов.
    criteria:
      - Сказано, что до первого шага упорядочен один элемент.
      - Сказано, что каждый шаг добавляет в упорядоченную часть один элемент и порядок в ней сохраняется.
      - Сделан вывод — после k шагов упорядочены k + 1 элементов.

  # ---------- База: черновые задания для проверки движка; тема дописывается отдельной правкой ----------
  - id: algo.sorting.insertion.q.base-write
    version: 1
    level: base
    role: practice
    step: 4
    skill: algo.sorting.insertion.s.write
    type: write
    format: code
    prompt: Напишите функцию `insertionSort(a)`, которая упорядочивает массив чисел по возрастанию сортировкой вставками и возвращает его.
    function: insertionSort
    starter: |
      function insertionSort(a) {
        // Ваш код
        return a;
      }
    solution: reference
    tests: [[[7, 3, 5, 1, 4]], [[]], [[2, 1, 2]]]
    hidden: vectors
    hints:
      - Внешний цикл — по индексу i от 1 до конца массива.
      - Внутри — сдвиг элемента влево, пока сосед слева больше него.
      - "Сдвиг можно сделать обменом соседей: `[a[j - 1], a[j]] = [a[j], a[j - 1]]`."

  - id: algo.sorting.insertion.q.base-find-bug
    version: 1
    level: base
    role: practice
    step: 6
    skill: algo.sorting.insertion.s.find-bug
    type: find-bug
    format: line
    prompt: В этой версии сортировки вставками одна ошибка. На массиве `[2, 1]` она возвращает `[2, 1]`. Найдите строку и причину.
    mutant: stop-before-zero
    reasons:
      - text: Элемент не может дойти до начала массива — до индекса 0
        correct: true
      - text: Первым вставляется элемент с индексом 0, а не 1
        misconception: algo.sorting.insertion.m.off-by-one-start
      - text: Ошибки в условии нет — нужен ещё один проход по массиву
        misconception: algo.sorting.insertion.m.loop-bound

  - id: algo.sorting.insertion.q.base-complexity
    version: 1
