  - id: algo.sorting.insertion.q.assemble
    version: 1
    level: fundament
    role: practice
    step: 4
    skill: algo.sorting.insertion.s.assemble
    type: parsons
    format: order
    prompt: >-
      Соберите функцию `insertionSort(a)`: она упорядочивает массив по возрастанию
      и возвращает его. Две строки лишние. Отступы ставьте кнопками ← и →.
    indent: true
    items:
      - { text: 'function insertionSort(a) {', indent: 0 }
      - { text: 'for (let i = 1; i < a.length; i++) {', indent: 1 }
      - { text: 'let j = i;', indent: 2 }
      - { text: 'while (j > 0 && a[j - 1] > a[j]) {', indent: 2 }
      - { text: '[a[j - 1], a[j]] = [a[j], a[j - 1]];', indent: 3 }
      - { text: 'j--;', indent: 3 }
      - { text: '}', indent: 2 }
      - { text: '}', indent: 1 }
      - { text: 'return a;', indent: 1 }
      - { text: '}', indent: 0 }
    distractors:
      - 'if (j > 0 && a[j - 1] > a[j]) {'
      - 'for (let i = 1; i < a.length - 1; i++) {'
    function: insertionSort
    solution: reference
    tests: [[[5, 2, 4, 1]]]
    hidden: vectors
    hints:
      - Внешний цикл перебирает элементы, которые вставляются; внутренний сдвигает элемент влево.
      - Сдвиг повторяется, пока сосед слева больше — значит, нужен цикл, а не одно условие.

