    mutant: start-from-two
    reasons:
      - text: Внешний цикл начинается с i = 2, и пара a[0], a[1] сравнивается, только если до неё дойдёт следующий элемент
        correct: true
      - text: Элемент не может дойти до индекса 0
        misconception: algo.sorting.insertion.m.wrong-bound
      - text: Последний элемент не вставляется
        misconception: algo.sorting.insertion.m.wrong-bound
    explanation: >-
      В [1, 3, 2] элемент 2 доходит до индекса 1 и сравнивается с a[0]. В [2, 1, 3]
      элемент 3 остаётся на месте, и пара 2, 1 так и не сравнивается.

