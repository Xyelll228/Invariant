  - id: algo.sorting.insertion.q.depth-write-inversions
    version: 1
    level: depth
    role: practice
    step: 4
    skill: algo.sorting.insertion.s.inversions
    type: write
    format: code
    prompt: >-
      Напишите функцию `countInversions(a)`: она возвращает число инверсий — пар
      индексов i < j, для которых a[i] > a[j]. Подойдёт и перебор пар, и подсчёт
      обменов сортировки вставками.
    function: countInversions
    starter: |
      function countInversions(a) {
        // Ваш код
        return 0;
      }
    solution: |
      function countInversions(a) {
        let count = 0;
        for (let i = 0; i < a.length; i++) {
          for (let j = i + 1; j < a.length; j++) if (a[i] > a[j]) count++;
        }
        return count;
      }
    tests: [[[3, 1, 2]], [[1, 2, 3]], [[2, 2, 1]]]
    hidden: vectors

