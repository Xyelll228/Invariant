id: term.loop-invariant
version: 1
term: инвариант цикла
en: loop invariant
definition: >-
  Утверждение, которое верно каждый раз перед проверкой условия цикла: до первой
  итерации, после каждой итерации и поэтому при выходе из цикла. Через инвариант
  доказывают, что цикл делает то, что нужно.
example: >-
  В сортировке вставками перед итерацией с индексом i часть массива a[0..i − 1]
  упорядочена.
topic: algo.analysis.algorithm
