id: term.index
version: 1
term: индекс
en: index
definition: >-
  Номер элемента в массиве. В «Инварианте» индексы считаются с нуля: у первого
  элемента индекс 0, у последнего в массиве длины n — индекс n − 1.
example: В массиве [7, 3, 5] у элемента 7 индекс 0, у элемента 5 — индекс 2.
topic: js.data.arrays
