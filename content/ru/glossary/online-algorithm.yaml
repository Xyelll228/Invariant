id: term.online-algorithm
version: 1
term: онлайн-алгоритм
en: online algorithm
definition: >-
  Алгоритм, который обрабатывает данные по мере поступления и не ждёт, пока
  придёт весь вход.
example: >-
  Сортировка вставками может принимать числа по одному: каждое новое число
  вставляется в уже упорядоченную часть.
synonyms: [онлайновый алгоритм]
