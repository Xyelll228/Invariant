id: term.stable-sort
version: 1
term: устойчивая сортировка
en: stable sort
definition: >-
  Сортировка, которая сохраняет взаимный порядок элементов с равными ключами:
  если элемент x стоял раньше элемента y и ключи у них равны, после сортировки
  x по-прежнему стоит раньше y.
example: >-
  Список студентов, упорядоченный по фамилии, сортируют по номеру группы.
  Устойчивая сортировка оставит студентов внутри каждой группы в алфавитном порядке.
topic: algo.sorting.insertion
confusedWith: [term.in-place-sort]
synonyms: [стабильная сортировка]
