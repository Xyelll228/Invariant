id: term.inversion
version: 1
term: инверсия
en: inversion
definition: >-
  Пара индексов i < j, для которой a[i] > a[j]: два элемента стоят в неправильном
  относительном порядке. В упорядоченном по возрастанию массиве инверсий нет.
example: В массиве [3, 1, 2] две инверсии — пары значений (3, 1) и (3, 2).
topic: algo.sorting.insertion
