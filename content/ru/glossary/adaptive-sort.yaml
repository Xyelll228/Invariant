id: term.adaptive-sort
version: 1
term: адаптивная сортировка
en: adaptive sort
definition: >-
  Сортировка, которая работает быстрее на почти упорядоченных данных: число её
  операций зависит от того, насколько беспорядочен вход, а не только от его длины.
example: >-
  Сортировка вставками адаптивна: на упорядоченном массиве ей хватает n − 1
  сравнений, а в целом её работа растёт вместе с числом инверсий.
topic: algo.sorting.basics
confusedWith: [term.stable-sort]
