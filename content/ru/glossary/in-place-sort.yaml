id: term.in-place-sort
version: 1
term: сортировка на месте
en: in-place sort
definition: >-
  Сортировка, при которой элементы переставляются внутри самого массива, а вне
  его одновременно хранится лишь постоянное число элементов.
example: Сортировка вставками работает на месте, а сортировка слиянием с отдельным буфером — нет.
topic: algo.sorting.insertion
confusedWith: [term.stable-sort]
