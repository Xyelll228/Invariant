id: term.binary-search
version: 1
term: бинарный поиск
en: binary search
definition: >-
  Поиск в упорядоченном массиве: на каждом шаге искомое значение сравнивается с
  элементом в середине отрезка, и половина отрезка, где искомого быть не может,
  отбрасывается.
example: >-
  Чтобы найти место для нового числа в упорядоченном массиве из 1000 элементов,
  бинарный поиск делает не больше 10 сравнений, а просмотр подряд — до 1000.
topic: algo.search.binary
synonyms: [двоичный поиск]
